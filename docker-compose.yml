services:
  seaweedfs-master:
    image: chrislusf/seaweedfs:latest
    command: master -mdir=/data -ip=seaweedfs-master -port=9333
    ports:
      - "9333:9333"
    volumes:
      - seaweedfs-master-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 10

  seaweedfs-volume:
    image: chrislusf/seaweedfs:latest
    command: volume -mserver=seaweedfs-master:9333 -ip=seaweedfs-volume -port=8080 -dir=/data -max=5
    ports:
      - "8080:8080"
    volumes:
      - seaweedfs-volume-data:/data
    depends_on:
      seaweedfs-master:
        condition: service_healthy

  seaweedfs-filer:
    image: chrislusf/seaweedfs:latest
    command: filer -master=seaweedfs-master:9333 -ip=seaweedfs-filer -port=8888
    ports:
      - "8888:8888"
    depends_on:
      seaweedfs-volume:
        condition: service_started

  seaweedfs-s3:
    image: chrislusf/seaweedfs:latest
    command: s3 -filer=seaweedfs-filer:8888 -port=8333 -config=/config/s3.json
    ports:
      - "8333:8333"
    volumes:
      - ./data/seaweedfs-config:/config
    depends_on:
      seaweedfs-filer:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8333/"]
      interval: 5s
      timeout: 3s
      retries: 20

  seaweedfs-init:
    image: amazon/aws-cli:latest
    environment:
      AWS_ACCESS_KEY_ID: local-access-key
      AWS_SECRET_ACCESS_KEY: local-secret-key
      AWS_DEFAULT_REGION: us-east-1
    command: s3 mb s3://writing-app-images --endpoint-url http://seaweedfs-s3:8333
    depends_on:
      seaweedfs-s3:
        condition: service_healthy
    restart: on-failure

volumes:
  seaweedfs-master-data:
  seaweedfs-volume-data:
