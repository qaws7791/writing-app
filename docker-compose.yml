services:
  rustfs_perms:
    image: alpine
    user: root
    volumes:
      - ./data:/fix_path
    command: chown -R 10001:10001 /fix_path

  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs-local
    security_opt:
      - "no-new-privileges:true"
    depends_on:
      rustfs_perms:
        condition: service_completed_successfully
    env_file:
      - .env.docker
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - RUSTFS_VOLUMES=/data
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
    volumes:
      - ./data:/data
    restart: unless-stopped

  rustfs_public_assets_init:
    image: minio/mc:latest
    depends_on:
      rustfs:
        condition: service_started
    env_file:
      - .env.docker
    entrypoint: ["/bin/sh", "/init-public-assets-bucket.sh"]
    volumes:
      - ./scripts/init-public-assets-bucket.sh:/init-public-assets-bucket.sh:ro
