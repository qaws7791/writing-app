services:
  redis:
    image: redis:7-alpine
    container_name: writing-app-redis-local
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    volumes:
      - redis_data:/data

  redisinsight:
    image: redis/redisinsight:latest
    container_name: writing-app-redisinsight-local
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "5540:5540"
    restart: unless-stopped
    volumes:
      - redisinsight_data:/data

  rustfs_perms:
    image: alpine
    user: root
    volumes:
      - ./data:/fix_path
    command: chown -R 10001:10001 /fix_path

  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs-local
    security_opt:
      - "no-new-privileges:true"
    depends_on:
      rustfs_perms:
        condition: service_completed_successfully
    ports:
      - "9000:9000" 
      - "9001:9001" 
    environment:
      - RUSTFS_VOLUMES=/data
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_ACCESS_KEY=rustfsadmin 
      - RUSTFS_SECRET_KEY=rustfsadmin 
    volumes:
      - ./data:/data
    restart: unless-stopped

  rustfs_public_assets_init:
    image: minio/mc:latest
    depends_on:
      rustfs:
        condition: service_started
    entrypoint: ["/bin/sh", "/init-public-assets-bucket.sh"]
    volumes:
      - ./scripts/init-public-assets-bucket.sh:/init-public-assets-bucket.sh:ro

volumes:
  redis_data:
  redisinsight_data:
