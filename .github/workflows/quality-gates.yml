name: 필수 품질 게이트

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  static-checks:
    name: 정적 검증
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun run check:toolchain
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run typecheck
      - if: always()
        run: bun scripts/ci-workspace-inventory.ts lint typecheck

  tests:
    name: 전체 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun run check:toolchain
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run test -- --summarize --continue=always
      - if: always()
        run: bun test ./scripts
      - if: always()
        run: node scripts/oxlint/workspace-rules.node-test.mjs
      - if: always()
        run: bun scripts/ci-workspace-inventory.ts test --summary-directory=.turbo/runs

  admin-dev-lifecycle:
    name: 관리자 개발 lifecycle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun run check:toolchain
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run test:admin-dev-lifecycle

  coverage:
    name: 커버리지
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun run check:toolchain
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run test:coverage
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          if-no-files-found: error
          retention-days: 14

  storybook-tests:
    name: Storybook 상호작용 및 접근성
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun run check:toolchain
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:storybook

  browser-e2e:
    name: 브라우저 E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun run check:toolchain
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e:flaky-policy
      - run: bun run test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ github.sha }}
          path: output/playwright/
          if-no-files-found: error
          retention-days: 14

  build:
    name: 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun run check:toolchain
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run check:resource-route-bundle
      - run: bun run check:admin-chart-route-bundle
      - run: bun run check:landing-route-bundle
      - if: always()
        run: bun scripts/ci-workspace-inventory.ts build

  audit:
    name: 의존성 감사
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        scope: [production, full]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun run check:toolchain
      - name: production 의존성 설치
        if: matrix.scope == 'production'
        run: bun install --production --frozen-lockfile
      - name: 전체 의존성 설치
        if: matrix.scope == 'full'
        run: bun install --frozen-lockfile
      - run: bun run audit:${{ matrix.scope }}
      - if: always()
        run: bun scripts/ci-workspace-inventory.ts audit
