                    - generic [ref=f2e64]: 목적：이 연구는 텍스트 분석이 글쓰기 지도에 효과적인 방안 중 하나가 될 수 있음을 제안하고 그 효과성을 확인하는 데 목적이 있다. 방법：이를 위해서 텍스트 갈래 지식에 기반하여 텍스트 분석 기준을 마련하고, 대학교 1학년 학생들을 대상으로 텍스트 분석을 활용한 글쓰기를 지도하고 보고서를 작성하도록 하였다. 수합한 보고서는 대조 집단의 보고서와 비교하여 효과성을 확인하고자 하였다. 결과：텍스트 분석을 통해 보고서의 특성을 파악한 뒤 보고서를 쓰게 하였을 때, 학습자들은 보고서의 특성에 부합하는 글을 썼으며 특히 보고서의 맥락과 표현 측면에서 높은 점수를 보였다. 결론：자기 주도적 학습 능력이 높은 학습자의 경우 텍스트를 분석하는 과정에서 텍스트 갈래의 특성을 파악해 보는 경험을 제공하는 것이 텍스트의 변화 가능성을 인식하고 자신의 의도를 효과적으로 전달할 수 있는 글을 생산하는 데 도움을 준다. 이 글을 통해 효과적인 글쓰기 지도 방법으로써 텍스트 분석의 가능성을 살펴볼 수 있을 것으로 기대한다. Purpose：The purpose of this study is to suggest that text analysis can be one of the effective measures for writing method and to confirm its effectiveness. Methods：In order to accomplish this research purpose, the criteria for text analysis were prepared based on text grammar, and the report was prepared by guiding first-year university students to writing using text analysis. First-year university students were asked to write reports using text analysis, comparing the reports with the control group. Results：The analysis results showed that the characteristics of the report were determined by analyzing the text, the report was written to match the characteristics of the report. Conclusion：For learners with high self-directed learning ability, providing experience to find the characteristics of text in the process of analyzing text helps produce text that can recognize the potential for change in text and effectively communicate their intentions. This article will explore the possibilities of text analysis as an effective way of writing method
