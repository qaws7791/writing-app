                            - generic [ref=e59]: 
                    - generic [ref=e61]: "이 연구는 쓰기 과제에서 예상 독자 유형을 상세화하는 것이 어떠한 효과가 있는지 파악하기 위한 시도의 일환으로, 유사한 입장과 반대 입장으로 예상 독자를 상정할 경우 글 결과물의 질(주장과 초점, 조직, 독자 인식, 언어와 문체)에 차이를 보이는지 여부를 확인하고자 하였다. 또한 독자 고려에 대해서 느끼는 어려움의 정도에 있어서도 이러한 예상 독자와의 입장 차이가 영향을 미치는지, 그리고 입장 차이를 고려하는 글쓰기에서 독자 고려에 대해 느끼는 어려움이 글 결과물 질과 관련이 있는지도 알아보고자 하였다. 이를 위하여 41명의 대학생이 연구에 참여하였으며, 이들은 유사한 입장 혹은 반대 입장의 예상 독자를 상정하는 쓰기 과제를 무작위로 배정 받아 한 편의 논증적 글쓰기를 완성한 후 독자 고려의 어려움을 보고하는 설문 문항에 답하였다. 연구 결과에 따르면, 두 예상 독자 유형은 글의 질 중에서 주장과 초점 항목에서 유의미한 차이를 보였으나 나머지 항목에서는 유의미한 차이를 보이지 않았다. 유형의 차이는 독자 고려를 어렵게 느끼는 정도에 있어서도 유의미하게 나타나지 않았으며, 독자 고려를 어렵게 느끼는 정도와 글 결과물의 질 사이에도 유의미한 관계가 나타나지 않았다. 이상과 같은 연구 결과를 바탕으로 교육적 시사점들을 도출하였다. The paper aims to offer some educational grounds for enhancing competences of audience awareness during argumentative writing by investigating the effects of audience types on writing quality. To this end, 41 undergraduate students wrote an argumentative essay and filled in a questionnaire to report the degree to which they had difficulties in audience awareness. To identify the effect of expected audience types, two different types of audiences were presented in the writing task: advocates and opponents of the writers’ argument. Two different writing tasks that differed solely in the type of audiences were randomly assigned to participants. Writing quality were measured in terms of four analytic scoring criteria: focus, organization, audience awareness, and language and style. The difference in audience types was significant in focus but not significant in the other criteria. Audience types also did not show significant difference in the degree of difficulties in audience awareness. Audience types and the writing quality did not show significant relationship with each other. Educational implications were presented by interpreting the results."
