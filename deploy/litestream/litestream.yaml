logging:
  level: info

retention:
  enabled: true

shutdown-sync-timeout: 30s
shutdown-sync-interval: 500ms

snapshot:
  interval: 1h
  retention: 720h

validation:
  interval: 5m

verify-compaction: true

dbs:
  - path: /var/lib/writing-app/api.sqlite
    monitor-interval: 1s
    checkpoint-interval: 1m
    busy-timeout: 5s
    replica:
      type: s3
      bucket: ${LITESTREAM_BUCKET}
      path: ${LITESTREAM_PATH}
      endpoint: ${LITESTREAM_ENDPOINT}
      region: auto
      sync-interval: 10s
