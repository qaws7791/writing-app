---
# 이 파일을 vault.yaml로 복사하고 실제 값을 넣은 뒤
# ansible-vault encrypt inventories/production/group_vars/vault.yaml을 실행한다.
vault_writing_app_learner_auth_secret: replace-with-at-least-32-random-characters
vault_writing_app_cursor_signing_secret: replace-with-distinct-32-random-characters
vault_writing_app_admin_auth_secret: replace-with-distinct-32-random-characters
vault_writing_app_r2_access_key_id: replace-with-r2-access-key-id
vault_writing_app_r2_secret_access_key: replace-with-r2-secret-access-key
vault_writing_app_admin_asset_s3_access_key: replace-with-r2-asset-access-key-id
vault_writing_app_admin_asset_s3_secret_key: replace-with-r2-asset-secret-access-key
vault_writing_app_deletion_marker_s3_access_key: replace-with-private-marker-access-key-id
vault_writing_app_deletion_marker_s3_secret_key: replace-with-private-marker-secret-access-key
vault_writing_app_google_client_id: replace-with-google-client-id
vault_writing_app_google_client_secret: replace-with-google-client-secret
vault_writing_app_openai_api_key: replace-with-openai-api-key
vault_writing_app_resend_api_key: replace-with-resend-api-key
# 선택 값이다.
vault_writing_app_registry_token: ""
