---
# 이 파일을 vault.yaml로 복사하고 실제 값을 넣은 뒤
# ansible-vault encrypt inventories/production/group_vars/vault.yaml을 실행한다.
vault_writing_app_better_auth_secret: replace-with-at-least-32-random-characters
vault_writing_app_admin_better_auth_secret: replace-with-distinct-32-random-characters
vault_writing_app_cloudflare_tunnel_token: replace-with-tunnel-token
vault_writing_app_r2_access_key_id: replace-with-r2-access-key-id
vault_writing_app_r2_secret_access_key: replace-with-r2-secret-access-key

# 선택 값이다.
vault_writing_app_registry_token: ""
vault_writing_app_google_client_id: ""
vault_writing_app_google_client_secret: ""
vault_writing_app_openai_api_key: ""
