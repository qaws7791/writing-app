writing_app_source_root: "{{ playbook_dir }}/../../.."

writing_app_compose_directory: /opt/writing-app
writing_app_config_directory: /etc/writing-app/config
writing_app_secrets_directory: /etc/writing-app/secrets
writing_app_data_directory: /var/lib/writing-app
writing_app_backup_directory: /var/backups/writing-app
writing_app_deployment_directory: /var/lib/writing-app/deployments
writing_app_container_uid: 10001
writing_app_container_gid: 10001

writing_app_caddy_image: caddy:2.11.4-alpine
writing_app_cloudflared_image: cloudflare/cloudflared:2026.6.0
writing_app_litestream_image: litestream/litestream:0.5.11

writing_app_web_origin: "https://{{ writing_app_web_host }}"
writing_app_api_origin: "https://{{ writing_app_api_host }}"
writing_app_admin_origin: "https://{{ writing_app_admin_host }}"
writing_app_admin_api_origin: "https://{{ writing_app_admin_api_host }}"

writing_app_openai_model: gpt-5.2
writing_app_google_client_id: ""
writing_app_google_client_secret: ""
writing_app_openai_api_key: ""
writing_app_registry_username: ""
writing_app_registry_token: ""
writing_app_verify_public_routes: false
