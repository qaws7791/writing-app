---
- name: 필수 배포 변수 검증
  ansible.builtin.assert:
    that:
      - writing_app_web_host | length > 0
      - writing_app_api_host | length > 0
      - writing_app_admin_host | length > 0
      - writing_app_admin_api_host | length > 0
      - writing_app_web_image is match('^.+@sha256:[0-9a-f]{64}$')
      - writing_app_api_image is match('^.+@sha256:[0-9a-f]{64}$')
      - writing_app_admin_image is match('^.+@sha256:[0-9a-f]{64}$')
      - writing_app_admin_api_image is match('^.+@sha256:[0-9a-f]{64}$')
      - writing_app_better_auth_secret | length >= 32
      - writing_app_admin_better_auth_secret | length >= 32
      - writing_app_better_auth_secret != writing_app_admin_better_auth_secret
      - not writing_app_better_auth_secret.startswith('replace-with')
      - not writing_app_admin_better_auth_secret.startswith('replace-with')
      - writing_app_cloudflare_tunnel_token | length > 0
      - not writing_app_cloudflare_tunnel_token.startswith('replace-with')
      - writing_app_r2_access_key_id | length > 0
      - not writing_app_r2_access_key_id.startswith('replace-with')
      - writing_app_r2_secret_access_key | length > 0
      - not writing_app_r2_secret_access_key.startswith('replace-with')
      - writing_app_r2_bucket | length > 0
      - not writing_app_r2_bucket.startswith('replace-with')
      - writing_app_r2_endpoint is match('^https://')
      - not writing_app_r2_endpoint.startswith('https://replace-with')
      - writing_app_r2_path | length > 0
    fail_msg: >-
      운영 host, image reference, 인증 secret, Tunnel token,
      R2 설정을 모두 명시해야 합니다.
  no_log: true

- name: 배포 ID 계산
  ansible.builtin.set_fact:
    writing_app_deployment_id: "{{ ansible_date_time.iso8601_basic_short }}"

- name: Compose 파일 배치
  ansible.builtin.copy:
    src: "{{ writing_app_source_root }}/deploy/compose/compose.yaml"
    dest: "{{ writing_app_compose_directory }}/compose.yaml"
    owner: root
    group: root
    mode: "0644"
  register: writing_app_compose_file

- name: Caddy 설정 배치
  ansible.builtin.copy:
    src: "{{ writing_app_source_root }}/deploy/caddy/caddyfile"
    dest: "{{ writing_app_config_directory }}/caddyfile"
    owner: root
    group: root
    mode: "0644"
  register: writing_app_caddy_file

- name: Litestream 설정 배치
  ansible.builtin.copy:
    src: "{{ writing_app_source_root }}/deploy/litestream/litestream.yaml"
    dest: "{{ writing_app_config_directory }}/litestream.yaml"
    owner: root
    group: root
    mode: "0644"
  register: writing_app_litestream_file

- name: Compose image 환경 파일 배치
  ansible.builtin.template:
    src: compose.env.j2
    dest: "{{ writing_app_compose_directory }}/.env"
    owner: root
    group: root
    mode: "0640"
    backup: true
  register: writing_app_compose_environment

- name: 직전 image reference 보존
  ansible.builtin.copy:
    src: "{{ writing_app_compose_environment.backup_file }}"
    dest: "{{ writing_app_compose_directory }}/.env.previous"
    remote_src: true
    owner: root
    group: root
    mode: "0640"
  when: writing_app_compose_environment.backup_file is defined

- name: 공개 런타임 환경 파일 배치
  ansible.builtin.template:
    src: "{{ item.source }}"
    dest: "{{ writing_app_config_directory }}/{{ item.destination }}"
    owner: root
    group: root
    mode: "0640"
  loop:
    - source: web.env.j2
      destination: web.env
    - source: admin.env.j2
      destination: admin.env
    - source: caddy.env.j2
      destination: caddy.env
  register: writing_app_public_environment_files

- name: 비밀 런타임 환경 파일 배치
  ansible.builtin.template:
    src: "{{ item.source }}"
    dest: "{{ writing_app_config_directory }}/{{ item.destination }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - source: api.env.j2
      destination: api.env
    - source: admin-api.env.j2
      destination: admin-api.env
    - source: litestream.env.j2
      destination: litestream.env
  register: writing_app_secret_environment_files
  no_log: true

- name: Cloudflare Tunnel token 배치
  ansible.builtin.copy:
    content: "{{ writing_app_cloudflare_tunnel_token }}\n"
    dest: "{{ writing_app_secrets_directory }}/cloudflare-tunnel-token"
    owner: "65532"
    group: "65532"
    mode: "0600"
  register: writing_app_tunnel_token_file
  no_log: true

- name: 배포 변경 여부 계산
  ansible.builtin.set_fact:
    writing_app_deployment_changed: >-
      {{
        writing_app_compose_file.changed
        or writing_app_caddy_file.changed
        or writing_app_litestream_file.changed
        or writing_app_compose_environment.changed
        or (
          writing_app_public_environment_files.results
          | selectattr('changed') | list | length > 0
        )
        or (
          writing_app_secret_environment_files.results
          | selectattr('changed') | list | length > 0
        )
        or writing_app_tunnel_token_file.changed
      }}

- name: Compose 설정 검증
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --env-file
      - .env
      - -f
      - compose.yaml
      - config
      - --quiet
    chdir: "{{ writing_app_compose_directory }}"
  changed_when: false

- name: GHCR 로그인
  community.docker.docker_login:
    registry_url: ghcr.io
    username: "{{ writing_app_registry_username }}"
    password: "{{ writing_app_registry_token }}"
    reauthorize: true
  when:
    - writing_app_registry_username | length > 0
    - writing_app_registry_token | length > 0
  no_log: true

- name: 변경된 배포 적용
  when: writing_app_deployment_changed | bool
  block:
    - name: 배포 이미지 pull
      community.docker.docker_compose_v2_pull:
        project_src: "{{ writing_app_compose_directory }}"
        env_files:
          - .env
        files:
          - compose.yaml
        profiles:
          - operations
        policy: always

    - name: 기존 DB 확인
      ansible.builtin.stat:
        path: "{{ writing_app_data_directory }}/api.sqlite"
      register: writing_app_database_before_deploy

    - name: 최초 기동 전 R2 복구 시도
      community.docker.docker_compose_v2_run:
        project_src: "{{ writing_app_compose_directory }}"
        env_files:
          - .env
        files:
          - compose.yaml
        profiles:
          - operations
        service: database-restore
        cleanup: true
        no_deps: true
        interactive: false
        tty: false
      when: not writing_app_database_before_deploy.stat.exists

    - name: 복구 후 DB 확인
      ansible.builtin.stat:
        path: "{{ writing_app_data_directory }}/api.sqlite"
      register: writing_app_database_after_restore

    - name: 복구된 DB 소유권 정규화
      ansible.builtin.file:
        path: "{{ writing_app_data_directory }}"
        state: directory
        owner: "{{ writing_app_container_uid }}"
        group: "{{ writing_app_container_gid }}"
        mode: "0750"
        recurse: true
      when: writing_app_database_after_restore.stat.exists

    - name: 기존 DB snapshot 백업
      community.docker.docker_compose_v2_run:
        project_src: "{{ writing_app_compose_directory }}"
        env_files:
          - .env
        files:
          - compose.yaml
        profiles:
          - operations
        service: database-backup
        argv:
          - "--source=/var/lib/writing-app/api.sqlite"
          - >-
            --output=/var/backups/writing-app/
            pre-deploy-{{ writing_app_deployment_id }}.sqlite
        cleanup: true
        no_deps: true
        interactive: false
        tty: false
      when: writing_app_database_after_restore.stat.exists

    - name: SQLite writer 중지
      community.docker.docker_compose_v2:
        project_src: "{{ writing_app_compose_directory }}"
        env_files:
          - .env
        files:
          - compose.yaml
        services:
          - api
          - admin-api
        dependencies: false
        state: stopped

    - name: DB migration 실행
      community.docker.docker_compose_v2_run:
        project_src: "{{ writing_app_compose_directory }}"
        env_files:
          - .env
        files:
          - compose.yaml
        profiles:
          - operations
        service: database-migrate
        cleanup: true
        no_deps: true
        interactive: false
        tty: false

    - name: 배포 DB 무결성 검증
      community.docker.docker_compose_v2_run:
        project_src: "{{ writing_app_compose_directory }}"
        env_files:
          - .env
        files:
          - compose.yaml
        profiles:
          - operations
        service: database-check
        cleanup: true
        no_deps: true
        interactive: false
        tty: false

    - name: Compose 서비스 기동 및 health 대기
      community.docker.docker_compose_v2:
        project_src: "{{ writing_app_compose_directory }}"
        env_files:
          - .env
        files:
          - compose.yaml
        pull: never
        remove_orphans: true
        state: present
        wait: true
        wait_timeout: 120
      register: writing_app_compose_deployment

    - name: 배포 image reference 기록
      ansible.builtin.copy:
        dest: >-
          {{ writing_app_deployment_directory }}/
          {{ writing_app_deployment_id }}.txt
        owner: root
        group: root
        mode: "0640"
        content: |
          web={{ writing_app_web_image }}
          api={{ writing_app_api_image }}
          admin={{ writing_app_admin_image }}
          admin-api={{ writing_app_admin_api_image }}

- name: 변경 없는 Compose 서비스 상태 확인
  community.docker.docker_compose_v2:
    project_src: "{{ writing_app_compose_directory }}"
    env_files:
      - .env
    files:
      - compose.yaml
    pull: missing
    state: present
    wait: true
    wait_timeout: 120
  when: not (writing_app_deployment_changed | bool)
