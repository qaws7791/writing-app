---
- name: 변경된 bind-mounted Caddyfile을 반영하도록 Caddy 재생성
  community.docker.docker_compose_v2:
    project_src: "{{ writing_app_compose_directory }}"
    env_files:
      - .env
    files:
      - compose.yaml
    dependencies: false
    pull: never
    recreate: always
    services:
      - caddy
    state: present
    wait: true
    wait_timeout: 120
