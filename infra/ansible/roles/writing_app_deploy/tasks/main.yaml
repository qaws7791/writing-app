---
- name: 필수 배포 변수 검증
  ansible.builtin.assert:
    that:
      - writing_app_environment in ['production', 'staging']
      - writing_app_web_host | length > 0
      - writing_app_admin_host | length > 0
      - writing_app_web_host is match(writing_app_public_hostname_pattern)
      - writing_app_admin_host is match(writing_app_public_hostname_pattern)
      - writing_app_web_host | lower != writing_app_admin_host | lower
      - writing_app_web_host | lower not in ['web', 'web:3000', 'api', 'api:4000', 'admin', 'admin:3001']
      - writing_app_admin_host | lower not in ['web', 'web:3000', 'api', 'api:4000', 'admin', 'admin:3001']
      - writing_app_web_image is match('^.+@sha256:[0-9a-f]{64}\Z')
      - writing_app_api_image is match('^.+@sha256:[0-9a-f]{64}\Z')
      - writing_app_admin_image is match('^.+@sha256:[0-9a-f]{64}\Z')
      - writing_app_caddy_image is match('^.+@sha256:[0-9a-f]{64}\Z')
      - writing_app_litestream_image is match('^.+@sha256:[0-9a-f]{64}\Z')
      - writing_app_web_image is match('^[^\x00-\x1F\x7F]+\Z')
      - writing_app_api_image is match('^[^\x00-\x1F\x7F]+\Z')
      - writing_app_admin_image is match('^[^\x00-\x1F\x7F]+\Z')
      - writing_app_caddy_image is match('^[^\x00-\x1F\x7F]+\Z')
      - writing_app_litestream_image is match('^[^\x00-\x1F\x7F]+\Z')
      - writing_app_learner_auth_secret | length >= 32
      - writing_app_cursor_signing_secret | length >= 32
      - writing_app_admin_auth_secret | length >= 32
      - writing_app_learner_auth_secret != writing_app_cursor_signing_secret
      - writing_app_learner_auth_secret != writing_app_admin_auth_secret
      - writing_app_cursor_signing_secret != writing_app_admin_auth_secret
      - not writing_app_learner_auth_secret.startswith('replace-with')
      - not writing_app_cursor_signing_secret.startswith('replace-with')
      - not writing_app_admin_auth_secret.startswith('replace-with')
      - writing_app_google_client_id | length > 0
      - not writing_app_google_client_id.startswith('replace-with')
      - writing_app_google_client_secret | length > 0
      - not writing_app_google_client_secret.startswith('replace-with')
      - writing_app_openai_api_key | length > 0
      - not writing_app_openai_api_key.startswith('replace-with')
      - writing_app_openai_model | length > 0
      - writing_app_resend_api_key | length > 0
      - not writing_app_resend_api_key.startswith('replace-with')
      - writing_app_auth_email_from | length > 0
      - writing_app_ai_feedback_user_daily_request_limit | int > 0
      - writing_app_ai_feedback_user_daily_success_limit | int > 0
      - writing_app_ai_feedback_global_daily_request_limit | int > 0
      - writing_app_ai_feedback_global_daily_success_limit | int > 0
      - writing_app_ai_feedback_provider_timeout_ms | int > 0
      - writing_app_ai_feedback_pending_ttl_ms | int > 0
      - (writing_app_ai_feedback_user_daily_success_limit | int) <= (writing_app_ai_feedback_user_daily_request_limit | int)
      - (writing_app_ai_feedback_global_daily_success_limit | int) <= (writing_app_ai_feedback_global_daily_request_limit | int)
      - (writing_app_ai_feedback_provider_timeout_ms | int) < (writing_app_ai_feedback_pending_ttl_ms | int)
      - writing_app_r2_access_key_id | length > 0
      - not writing_app_r2_access_key_id.startswith('replace-with')
      - writing_app_r2_secret_access_key | length > 0
      - not writing_app_r2_secret_access_key.startswith('replace-with')
      - writing_app_r2_bucket | length > 0
      - not writing_app_r2_bucket.startswith('replace-with')
      - writing_app_r2_endpoint is match('^https://')
      - not writing_app_r2_endpoint.startswith('https://replace-with')
      - writing_app_r2_path | length > 0
      - writing_app_r2_path is match('^writing-app/' ~ writing_app_environment ~ '/api[.]sqlite\Z')
      - writing_app_admin_asset_s3_access_key | length > 0
      - not writing_app_admin_asset_s3_access_key.startswith('replace-with')
      - writing_app_admin_asset_s3_secret_key | length > 0
      - not writing_app_admin_asset_s3_secret_key.startswith('replace-with')
      - writing_app_admin_asset_s3_bucket | length > 0
      - not writing_app_admin_asset_s3_bucket.startswith('replace-with')
      - writing_app_admin_asset_s3_bucket != writing_app_r2_bucket
      - writing_app_admin_asset_s3_endpoint is match('^https://')
      - not writing_app_admin_asset_s3_endpoint.startswith('https://replace-with')
      - writing_app_admin_asset_s3_region | length > 0
      - writing_app_admin_asset_public_base_url is match('^https://')
      - not writing_app_admin_asset_public_base_url.startswith('https://replace-with')
      - writing_app_content_asset_image_allowed_origins | length == 2
      - writing_app_content_asset_image_allowed_origins | unique | list | length == 2
      - >-
        writing_app_content_asset_image_allowed_origins
        | select('match', '^https://[^/?#:@]+(?::[0-9]+)?\Z')
        | list
        | length == 2
      - writing_app_admin_asset_public_base_url in writing_app_content_asset_image_allowed_origins
      - writing_app_deletion_marker_s3_access_key | length > 0
      - not writing_app_deletion_marker_s3_access_key.startswith('replace-with')
      - writing_app_deletion_marker_s3_secret_key | length > 0
      - not writing_app_deletion_marker_s3_secret_key.startswith('replace-with')
      - writing_app_deletion_marker_s3_bucket | length > 0
      - not writing_app_deletion_marker_s3_bucket.startswith('replace-with')
      - writing_app_deletion_marker_s3_bucket != writing_app_admin_asset_s3_bucket
      - writing_app_deletion_marker_s3_endpoint is match('^https://')
      - not writing_app_deletion_marker_s3_endpoint.startswith('https://replace-with')
      - writing_app_deletion_marker_s3_region | length > 0
      - writing_app_deletion_marker_s3_prefix is match('^[A-Za-z0-9._-]+(?:/[A-Za-z0-9._-]+)*\Z')
      - writing_app_deletion_marker_s3_prefix is match('^privacy/' ~ writing_app_environment ~ '/deletion-markers\Z')
    fail_msg: >-
      production 또는 staging 환경, 서로 다른 소문자 DNS 운영 host와 image reference, 인증·cursor secret,
      Google OAuth·Resend·OpenAI·AI 제한, Litestream backup, public asset과
      private 삭제 marker 저장소 설정을 모두 명시해야 합니다.
  no_log: true

- name: 관리자 MCP 배포 대상 검증
  ansible.builtin.assert:
    that:
      - >-
        not (writing_app_admin_mcp_enabled | bool)
        or writing_app_environment == 'staging'
      - >-
        not (writing_app_admin_mcp_enabled | bool)
        or (writing_app_verify_public_routes | bool)
      - >-
        not (writing_app_admin_mcp_changes_enabled | bool)
        or (writing_app_admin_mcp_enabled | bool)
      - >-
        (writing_app_admin_mcp_static_bearer_rebaseline_approved | bool)
        == (writing_app_admin_mcp_static_bearer_rebaseline_image | length > 0)
      - >-
        not (writing_app_admin_mcp_static_bearer_rebaseline_approved | bool)
        or not (writing_app_admin_mcp_enabled | bool)
      - >-
        not (writing_app_admin_mcp_static_bearer_rebaseline_approved | bool)
        or writing_app_environment == 'staging'
      - >-
        not (writing_app_admin_mcp_static_bearer_rebaseline_approved | bool)
        or writing_app_admin_mcp_static_bearer_rebaseline_image
        == writing_app_api_image
    fail_msg: >-
      관리자 MCP는 public route 검증을 사용하는 staging에서만 활성화할 수 있습니다.
      Production 활성화는 금지합니다.
      Static Bearer rollback rebaseline은 MCP 비활성 staging에서 현재 API digest를 정확히
      지정한 one-shot 배포만 허용합니다.

- name: 관리자 MCP staging 입력 검증
  ansible.builtin.assert:
    that:
      - writing_app_admin_mcp_host is match(writing_app_public_hostname_pattern)
      - writing_app_admin_mcp_host | lower != writing_app_web_host | lower
      - writing_app_admin_mcp_host | lower != writing_app_admin_host | lower
      - writing_app_admin_mcp_host | lower not in ['web', 'web:3000', 'api', 'api:4000', 'admin', 'admin:3001']
    fail_msg: >-
      관리자 MCP에는 다른 앱 host와 분리된 전용 staging host가 필요합니다.
  no_log: true
  when: writing_app_admin_mcp_enabled | bool

- name: 관리자 MCP 변경 설정 검증
  ansible.builtin.assert:
    that:
      - writing_app_admin_mcp_approval_ttl_seconds | int >= 60
      - writing_app_admin_mcp_approval_ttl_seconds | int <= 3600
      - writing_app_admin_mcp_execution_lease_seconds | int >= 1
      - writing_app_admin_mcp_execution_lease_seconds | int <= 600
      - writing_app_admin_mcp_request_state_secret | length >= 32
      - not writing_app_admin_mcp_request_state_secret.startswith('replace-with')
      - writing_app_admin_mcp_request_state_secret != writing_app_learner_auth_secret
      - writing_app_admin_mcp_request_state_secret != writing_app_cursor_signing_secret
      - writing_app_admin_mcp_request_state_secret != writing_app_admin_auth_secret
    fail_msg: >-
      관리자 MCP 변경 기능에는 허용 범위의 TTL, lease와 다른 인증 secret과 분리된
      32자 이상의 request state secret이 필요합니다.
  no_log: true
  when: writing_app_admin_mcp_changes_enabled | bool

- name: Daily maintenance 외부 증거 사전 검증
  ansible.builtin.include_role:
    name: writing_app_maintenance
    tasks_from: validate

- name: 배포 ID 계산
  ansible.builtin.set_fact:
    writing_app_deploy_deployment_id: "{{ ansible_date_time.iso8601_basic_short }}"

- name: Compose 파일 배치
  ansible.builtin.copy:
    src: "{{ writing_app_source_root }}/deploy/compose/compose.yaml"
    dest: "{{ writing_app_compose_directory }}/compose.yaml"
    owner: root
    group: root
    mode: "0644"
  register: writing_app_deploy_compose_file

- name: Caddy 설정 배치
  ansible.builtin.copy:
    src: "{{ writing_app_source_root }}/deploy/caddy/caddyfile"
    dest: "{{ writing_app_config_directory }}/caddyfile"
    owner: root
    group: root
    mode: "0644"
  register: writing_app_deploy_caddy_file

- name: 선택적 Caddy site 디렉터리 생성
  ansible.builtin.file:
    path: "{{ writing_app_config_directory }}/caddy-sites"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: 관리자 MCP Caddy site 배치
  ansible.builtin.template:
    src: admin-mcp.caddyfile.j2
    dest: "{{ writing_app_config_directory }}/caddy-sites/admin-mcp.caddy"
    owner: root
    group: root
    mode: "0640"
  register: writing_app_deploy_admin_mcp_caddy_file

- name: Litestream 설정 배치
  ansible.builtin.copy:
    src: "{{ writing_app_source_root }}/deploy/litestream/litestream.yaml"
    dest: "{{ writing_app_config_directory }}/litestream.yaml"
    owner: root
    group: root
    mode: "0644"
  register: writing_app_deploy_litestream_file

- name: Compose image 환경 파일 배치
  ansible.builtin.template:
    src: compose.env.j2
    dest: "{{ writing_app_compose_directory }}/.env"
    owner: root
    group: root
    mode: "0640"
    backup: true
  register: writing_app_deploy_compose_environment

- name: 공개 런타임 환경 파일 배치
  ansible.builtin.template:
    src: "{{ item.source }}"
    dest: "{{ writing_app_config_directory }}/{{ item.destination }}"
    owner: root
    group: root
    mode: "0640"
  loop:
    - source: web.env.j2
      destination: web.env
    - source: admin.env.j2
      destination: admin.env
    - source: caddy.env.j2
      destination: caddy.env
  register: writing_app_deploy_public_environment_files

- name: 비밀 런타임 환경 파일 배치
  ansible.builtin.template:
    src: "{{ item.source }}"
    dest: "{{ writing_app_config_directory }}/{{ item.destination }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - source: api.env.j2
      destination: api.env
    - source: litestream.env.j2
      destination: litestream.env
  register: writing_app_deploy_secret_environment_files
  no_log: true

- name: 현재 배포 입력 파일 checksum 계산
  ansible.builtin.stat:
    path: "{{ item }}"
    checksum_algorithm: sha256
  loop:
    - "{{ writing_app_compose_directory }}/compose.yaml"
    - "{{ writing_app_compose_directory }}/.env"
    - "{{ writing_app_config_directory }}/caddyfile"
    - "{{ writing_app_config_directory }}/caddy-sites/admin-mcp.caddy"
    - "{{ writing_app_config_directory }}/litestream.yaml"
    - "{{ writing_app_config_directory }}/web.env"
    - "{{ writing_app_config_directory }}/admin.env"
    - "{{ writing_app_config_directory }}/caddy.env"
    - "{{ writing_app_config_directory }}/api.env"
    - "{{ writing_app_config_directory }}/litestream.env"
  register: writing_app_deploy_input_files
  changed_when: false
  no_log: true

- name: 현재 배포 입력 fingerprint 계산
  ansible.builtin.set_fact:
    writing_app_deploy_desired_state_fingerprint: >-
      {{
        (
          writing_app_deploy_input_files.results
          | map(attribute='stat.checksum')
          | join('\n')
        )
        | hash('sha256')
      }}
  no_log: true

- name: 직전 검증 성공 marker 확인
  ansible.builtin.stat:
    path: "{{ writing_app_deploy_verified_state_path }}"
  register: writing_app_deploy_verified_state_marker
  changed_when: false

- name: 직전 검증 성공 fingerprint 읽기
  ansible.builtin.slurp:
    src: "{{ writing_app_deploy_verified_state_path }}"
  register: writing_app_deploy_verified_state_content
  when: writing_app_deploy_verified_state_marker.stat.exists
  no_log: true

- name: 현재 입력의 직전 검증 성공 여부 계산
  ansible.builtin.set_fact:
    writing_app_deploy_verified_state_matches: >-
      {{
        writing_app_deploy_verified_state_marker.stat.exists
        and (
          writing_app_deploy_verified_state_content.content
          | default('')
          | b64decode
          | trim
        ) == writing_app_deploy_desired_state_fingerprint
      }}
  no_log: true

- name: 배포 변경 여부 계산
  ansible.builtin.set_fact:
    writing_app_deploy_deployment_changed: >-
      {{
        writing_app_deploy_compose_file.changed
        or writing_app_deploy_caddy_file.changed
        or writing_app_deploy_admin_mcp_caddy_file.changed
        or writing_app_deploy_litestream_file.changed
        or writing_app_deploy_compose_environment.changed
        or (
          writing_app_deploy_public_environment_files.results
          | selectattr('changed') | list | length > 0
        )
        or (
          writing_app_deploy_secret_environment_files.results
          | selectattr('changed') | list | length > 0
        )
        or not (writing_app_deploy_verified_state_matches | bool)
      }}

- name: Compose 설정 검증
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --env-file
      - .env
      - -f
      - compose.yaml
      - config
      - --quiet
    chdir: "{{ writing_app_compose_directory }}"
  changed_when: false

- name: 관리자 MCP rollback Compose snapshot 확인
  ansible.builtin.stat:
    path: "{{ writing_app_compose_directory }}/{{ item }}"
    checksum_algorithm: sha256
  loop:
    - .env
    - .env.verified
    - .env.previous
  register: writing_app_deploy_admin_mcp_compose_environments
  changed_when: false
  no_log: true
  when: >-
    (writing_app_admin_mcp_enabled | bool)
    or (writing_app_admin_mcp_static_bearer_rebaseline_approved | bool)

- name: 관리자 MCP rollback Compose snapshot 보호 속성 검증
  ansible.builtin.assert:
    that:
      - writing_app_deploy_admin_mcp_compose_environments.results[0].stat.exists
      - writing_app_deploy_admin_mcp_compose_environments.results[0].stat.isreg
      - writing_app_deploy_admin_mcp_compose_environments.results[0].stat.pw_name == 'root'
      - writing_app_deploy_admin_mcp_compose_environments.results[0].stat.mode == '0640'
      - writing_app_deploy_admin_mcp_compose_environments.results[1].stat.exists
      - writing_app_deploy_admin_mcp_compose_environments.results[1].stat.isreg
      - writing_app_deploy_admin_mcp_compose_environments.results[1].stat.pw_name == 'root'
      - writing_app_deploy_admin_mcp_compose_environments.results[1].stat.mode == '0640'
      - >-
        not (writing_app_admin_mcp_static_bearer_rebaseline_approved | bool)
        or writing_app_deploy_admin_mcp_compose_environments.results[0].stat.checksum
        == writing_app_deploy_admin_mcp_compose_environments.results[1].stat.checksum
    fail_msg: >-
      관리자 MCP 활성화와 Static Bearer rebaseline에는 보호된 현재·검증 성공 Compose
      snapshot이 필요합니다. Rebaseline은 현재와 검증 성공 snapshot이 같아야 합니다.
  no_log: true
  when: >-
    (writing_app_admin_mcp_enabled | bool)
    or (writing_app_admin_mcp_static_bearer_rebaseline_approved | bool)

- name: Static Bearer rebaseline API image 해석
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --env-file
      - .env.verified
      - -f
      - compose.yaml
      - config
      - --format
      - json
  args:
    chdir: "{{ writing_app_compose_directory }}"
  register: writing_app_deploy_admin_mcp_rebaseline_configuration
  changed_when: false
  no_log: true
  when: writing_app_admin_mcp_static_bearer_rebaseline_approved | bool

- name: Static Bearer rebaseline API image 검증
  ansible.builtin.assert:
    that:
      - >-
        (writing_app_deploy_admin_mcp_rebaseline_configuration.stdout | from_json).services.api.image
        == writing_app_admin_mcp_static_bearer_rebaseline_image
    fail_msg: >-
      Rebaseline 승인 digest가 현재 검증 성공 API image와 일치하지 않습니다.
  no_log: true
  when: writing_app_admin_mcp_static_bearer_rebaseline_approved | bool

- name: Static Bearer rebaseline API image binary 검증
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - none
      - --pull
      - never
      - --read-only
      - --cap-drop
      - ALL
      - --security-opt
      - no-new-privileges:true
      - --entrypoint
      - bun
      - "{{ writing_app_admin_mcp_static_bearer_rebaseline_image }}"
      - -e
      - >-
        const{accessSync,constants}=require('node:fs');for(const p of
        ['/workspace/bin/admin-mcp-token-issue','/workspace/bin/admin-mcp-token-revoke'])
        accessSync(p,constants.X_OK)
  changed_when: false
  when: writing_app_admin_mcp_static_bearer_rebaseline_approved | bool

- name: 관리자 MCP 활성 배포 rollback 후보 선택
  ansible.builtin.set_fact:
    writing_app_deploy_admin_mcp_rollback_environment_file: >-
      {{
        (
          writing_app_deploy_admin_mcp_compose_environments.results[0].stat.checksum
          == writing_app_deploy_admin_mcp_compose_environments.results[1].stat.checksum
        )
        | ternary('.env.previous', '.env.verified')
      }}
  no_log: true
  when: writing_app_admin_mcp_enabled | bool

- name: 관리자 MCP 활성 배포 rollback 후보 확인
  ansible.builtin.stat:
    path: >-
      {{ writing_app_compose_directory }}/{{ writing_app_deploy_admin_mcp_rollback_environment_file }}
    checksum_algorithm: sha256
  register: writing_app_deploy_admin_mcp_rollback_environment
  changed_when: false
  no_log: true
  when: writing_app_admin_mcp_enabled | bool

- name: 관리자 MCP 활성 배포 rollback 후보 보호 속성 검증
  ansible.builtin.assert:
    that:
      - writing_app_deploy_admin_mcp_rollback_environment.stat.exists
      - writing_app_deploy_admin_mcp_rollback_environment.stat.isreg
      - writing_app_deploy_admin_mcp_rollback_environment.stat.pw_name == 'root'
      - writing_app_deploy_admin_mcp_rollback_environment.stat.mode == '0640'
    fail_msg: >-
      관리자 MCP 활성 배포에는 보호된 rollback 후보 Compose snapshot이 필요합니다.
  no_log: true
  when: writing_app_admin_mcp_enabled | bool

- name: 관리자 MCP 활성 배포 rollback 후보 API image 해석
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --env-file
      - "{{ writing_app_deploy_admin_mcp_rollback_environment_file }}"
      - -f
      - compose.yaml
      - config
      - --format
      - json
  args:
    chdir: "{{ writing_app_compose_directory }}"
  register: writing_app_deploy_admin_mcp_rollback_configuration
  changed_when: false
  no_log: true
  when: writing_app_admin_mcp_enabled | bool

- name: 관리자 MCP 활성 배포 rollback 후보 API image 기록
  ansible.builtin.set_fact:
    writing_app_deploy_admin_mcp_rollback_api_image: >-
      {{
        (writing_app_deploy_admin_mcp_rollback_configuration.stdout | from_json).services.api.image
      }}
  no_log: true
  when: writing_app_admin_mcp_enabled | bool

- name: 관리자 MCP 활성 배포 rollback 후보 API image 불변성 검증
  ansible.builtin.assert:
    that:
      - >-
        writing_app_deploy_admin_mcp_rollback_api_image
        is match('^.+@sha256:[0-9a-f]{64}\Z')
    fail_msg: >-
      관리자 MCP 활성 배포의 rollback 후보 API image는 immutable digest여야 합니다.
  no_log: true
  when: writing_app_admin_mcp_enabled | bool

- name: 관리자 MCP 활성 배포 rollback 후보 Static Bearer binary 검증
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - none
      - --pull
      - never
      - --read-only
      - --cap-drop
      - ALL
      - --security-opt
      - no-new-privileges:true
      - --entrypoint
      - bun
      - "{{ writing_app_deploy_admin_mcp_rollback_api_image }}"
      - -e
      - >-
        const{accessSync,constants}=require('node:fs');for(const p of
        ['/workspace/bin/admin-mcp-token-issue','/workspace/bin/admin-mcp-token-revoke'])
        accessSync(p,constants.X_OK)
  changed_when: false
  when: writing_app_admin_mcp_enabled | bool

- name: GHCR 로그인
  community.docker.docker_login:
    registry_url: ghcr.io
    username: "{{ writing_app_registry_username }}"
    password: "{{ writing_app_registry_token }}"
    reauthorize: true
  when:
    - writing_app_registry_username | length > 0
    - writing_app_registry_token | length > 0
  no_log: true

- name: 변경된 배포 적용
  when: writing_app_deploy_deployment_changed | bool
  block:
    - name: 배포 이미지 pull
      community.docker.docker_compose_v2_pull:
        project_src: "{{ writing_app_compose_directory }}"
        env_files:
          - .env
        files:
          - compose.yaml
        profiles:
          - operations
        policy: always

    - name: 변경된 Caddy 설정 사전 검증
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --env-file
          - "{{ writing_app_config_directory }}/caddy.env"
          - --mount
          - "type=bind,source={{ writing_app_config_directory }}/caddyfile,target=/etc/caddy/caddyfile,readonly"
          - --mount
          - "type=bind,source={{ writing_app_config_directory }}/caddy-sites,target=/etc/caddy/sites,readonly"
          - "{{ writing_app_caddy_image }}"
          - caddy
          - validate
          - --config
          - /etc/caddy/caddyfile
          - --adapter
          - caddyfile
      changed_when: false

    - name: 배포 DB 리허설 디렉터리 생성
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ writing_app_container_uid }}"
        group: "{{ writing_app_container_gid }}"
        mode: "0750"
      loop:
        - >-
          {{ writing_app_backup_directory }}/deploy-{{ writing_app_deploy_deployment_id }}
        - >-
          {{ writing_app_backup_directory }}/deploy-{{ writing_app_deploy_deployment_id }}/rehearsal

    - name: 기존 DB 확인
      ansible.builtin.stat:
        path: "{{ writing_app_data_directory }}/api.sqlite"
      register: writing_app_deploy_database_before_deploy

    - name: 최초 기동 전 격리 경로로 R2 복구 시도
      community.docker.docker_compose_v2_run:
        project_src: "{{ writing_app_compose_directory }}"
        env_files:
          - .env
        files:
          - compose.yaml
        profiles:
          - operations
        service: database-restore
        argv:
          - restore
          - -config
          - /etc/litestream.yaml
          - -if-db-not-exists
          - -if-replica-exists
          - -integrity-check
          - full
          - -o
          - >-
            /var/backups/writing-app/deploy-{{ writing_app_deploy_deployment_id }}/rehearsal/api.sqlite
          - /var/lib/writing-app/api.sqlite
        cleanup: true
        no_deps: true
        interactive: false
        tty: false
      when: not writing_app_deploy_database_before_deploy.stat.exists

    - name: 기존 DB 소유권 정규화
      ansible.builtin.file:
        path: "{{ writing_app_data_directory }}"
        state: directory
        owner: "{{ writing_app_container_uid }}"
        group: "{{ writing_app_container_gid }}"
        mode: "0750"
        recurse: true
      when: writing_app_deploy_database_before_deploy.stat.exists

    - name: DB 리허설용 live snapshot 생성
      community.docker.docker_compose_v2_run:
        project_src: "{{ writing_app_compose_directory }}"
        env_files:
          - .env
        files:
          - compose.yaml
        profiles:
          - operations
        service: database-backup
        argv:
          - "--source=/var/lib/writing-app/api.sqlite"
          - "--output=/var/backups/writing-app/deploy-{{ writing_app_deploy_deployment_id }}/pre-rehearsal.sqlite"
        cleanup: true
        no_deps: true
        interactive: false
        tty: false
      when: writing_app_deploy_database_before_deploy.stat.exists

    - name: Live snapshot을 격리된 리허설 DB로 복제
      ansible.builtin.copy:
        src: >-
          {{ writing_app_backup_directory }}/deploy-{{ writing_app_deploy_deployment_id }}/pre-rehearsal.sqlite
        dest: >-
          {{ writing_app_backup_directory }}/deploy-{{ writing_app_deploy_deployment_id }}/rehearsal/api.sqlite
        remote_src: true
        owner: "{{ writing_app_container_uid }}"
        group: "{{ writing_app_container_gid }}"
        mode: "0640"
      when: writing_app_deploy_database_before_deploy.stat.exists

    - name: 최초 DB 리허설용 빈 DB 생성
      ansible.builtin.copy:
        content: ""
        dest: >-
          {{ writing_app_backup_directory }}/deploy-{{ writing_app_deploy_deployment_id }}/rehearsal/api.sqlite
        force: false
        owner: "{{ writing_app_container_uid }}"
        group: "{{ writing_app_container_gid }}"
        mode: "0640"
      when: not writing_app_deploy_database_before_deploy.stat.exists

    - name: Candidate image로 격리된 DB migration 리허설
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --network
          - none
          - --user
          - "{{ writing_app_container_uid }}:{{ writing_app_container_gid }}"
          - --env
          - DATABASE_URL=file:/var/lib/writing-app/api.sqlite
          - --env
          - NODE_ENV=production
          - --mount
          - >-
            type=bind,source={{ writing_app_backup_directory }}/deploy-{{ writing_app_deploy_deployment_id }}/rehearsal,target=/var/lib/writing-app
          - "{{ writing_app_api_image }}"
          - bun
          - /workspace/bin/database-migrate
      changed_when: false

    - name: Candidate image로 격리된 DB 검증 리허설
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --network
          - none
          - --user
          - "{{ writing_app_container_uid }}:{{ writing_app_container_gid }}"
          - --env
          - DATABASE_URL=file:/var/lib/writing-app/api.sqlite
          - --env
          - NODE_ENV=production
          - --mount
          - >-
            type=bind,source={{ writing_app_backup_directory }}/deploy-{{ writing_app_deploy_deployment_id }}/rehearsal,target=/var/lib/writing-app,readonly
          - "{{ writing_app_api_image }}"
          - bun
          - /workspace/bin/database-check
      changed_when: false

    - name: 검증된 리허설 DB 작업본 정리
      ansible.builtin.file:
        path: >-
          {{ writing_app_backup_directory }}/deploy-{{ writing_app_deploy_deployment_id }}/rehearsal
        state: absent
      when: writing_app_deploy_database_before_deploy.stat.exists

    - name: 실제 DB 변경 전 operation lock 보존 설정
      ansible.builtin.set_fact:
        writing_app_deploy_database_mutation_started: true
        writing_app_deploy_recovery_status: pending
        writing_app_deploy_release_operation_lock: false

    - name: SQLite writer 중지
      community.docker.docker_compose_v2:
        project_src: "{{ writing_app_compose_directory }}"
        env_files:
          - .env
        files:
          - compose.yaml
        services:
          - api
        dependencies: false
        state: stopped

    - name: 검증된 최초 DB를 실제 경로에 원자적으로 설치
      ansible.builtin.copy:
        src: >-
          {{ writing_app_backup_directory }}/deploy-{{ writing_app_deploy_deployment_id }}/rehearsal/api.sqlite
        dest: "{{ writing_app_data_directory }}/api.sqlite"
        remote_src: true
        owner: "{{ writing_app_container_uid }}"
        group: "{{ writing_app_container_gid }}"
        mode: "0640"
      when: not writing_app_deploy_database_before_deploy.stat.exists

    - name: 설치가 끝난 최초 DB 리허설 작업본 정리
      ansible.builtin.file:
        path: >-
          {{ writing_app_backup_directory }}/deploy-{{ writing_app_deploy_deployment_id }}/rehearsal
        state: absent
      when: not writing_app_deploy_database_before_deploy.stat.exists

    - name: 중지된 DB의 최종 pre-deploy snapshot 백업
      community.docker.docker_compose_v2_run:
        project_src: "{{ writing_app_compose_directory }}"
        env_files:
          - .env
        files:
          - compose.yaml
        profiles:
          - operations
        service: database-backup
        argv:
          - "--source=/var/lib/writing-app/api.sqlite"
          - "--output=/var/backups/writing-app/deploy-{{ writing_app_deploy_deployment_id }}/pre-deploy.sqlite"
        cleanup: true
        no_deps: true
        interactive: false
        tty: false
      when: writing_app_deploy_database_before_deploy.stat.exists

    - name: DB migration 실행
      community.docker.docker_compose_v2_run:
        project_src: "{{ writing_app_compose_directory }}"
        env_files:
          - .env
        files:
          - compose.yaml
        profiles:
          - operations
        service: database-migrate
        cleanup: true
        no_deps: true
        interactive: false
        tty: false

    - name: 배포 DB 무결성 검증
      community.docker.docker_compose_v2_run:
        project_src: "{{ writing_app_compose_directory }}"
        env_files:
          - .env
        files:
          - compose.yaml
        profiles:
          - operations
        service: database-check
        cleanup: true
        no_deps: true
        interactive: false
        tty: false

    - name: Compose 서비스 기동 및 health 대기
      community.docker.docker_compose_v2:
        project_src: "{{ writing_app_compose_directory }}"
        env_files:
          - .env
        files:
          - compose.yaml
        pull: never
        recreate: always
        remove_orphans: true
        state: present
        wait: true
        wait_timeout: 120

    - name: 공개 검증 대기 상태 기록
      ansible.builtin.set_fact:
        writing_app_deploy_recovery_status: awaiting-public-verification
        writing_app_deploy_release_operation_lock: false

- name: 변경 없는 Compose 서비스 상태 확인
  community.docker.docker_compose_v2:
    project_src: "{{ writing_app_compose_directory }}"
    env_files:
      - .env
    files:
      - compose.yaml
    pull: missing
    state: present
    wait: true
    wait_timeout: 120
  when: not (writing_app_deploy_deployment_changed | bool)

- name: Daily maintenance timer 설치
  ansible.builtin.include_role:
    name: writing_app_maintenance
