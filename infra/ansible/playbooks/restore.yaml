---
- name: Writing App SQLite 복구
  hosts: writing_app
  become: true
  gather_facts: true
  vars_files:
    - ../vars/defaults.yaml
  tasks:
    - name: 복구 작업 경계 계산
      ansible.builtin.set_fact:
        writing_app_restore_id: >-
          restore-{{ ansible_date_time.iso8601_basic_short }}
        writing_app_restore_container_database_url: >-
          file:/var/lib/writing-app/api.sqlite
        writing_app_restore_batch_size_value: >-
          {{ writing_app_restore_batch_size | default(100) | int }}

    - name: 복구 candidate marker DB 경계 계산
      ansible.builtin.set_fact:
        writing_app_restore_marker_database_url: >-
          file:/var/backups/writing-app/{{ writing_app_restore_id }}/candidate/api.sqlite

    - name: DB 복구 one-time 승인과 대상 확인
      ansible.builtin.assert:
        that:
          - writing_app_allow_database_restore | default(false) | bool
          - writing_app_environment in ['production', 'staging']
          - writing_app_restore_environment_confirmation | default('') == writing_app_environment
          - writing_app_restore_expected_database_url | default('') == writing_app_restore_container_database_url
          - >-
            writing_app_restore_snapshot_at | default('')
            is match(
              '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:[.][0-9]+)?(?:Z|[+-][0-9]{2}:[0-9]{2})\Z'
            )
          - writing_app_restore_batch_size_value | int >= 1
          - writing_app_restore_batch_size_value | int <= 1000
        fail_msg: >-
          writing_app_allow_database_restore=true, inventory와 같은 환경 확인,
          container 대상 DATABASE_URL, timezone 포함 snapshot 시각과 1..1000 batch를
          이번 실행의 extra vars로 명시해야 합니다.

    - name: DB 복구 시작 시각 기록
      ansible.builtin.command:
        argv:
          - date
          - -u
          - +%s|%Y-%m-%dT%H:%M:%SZ
      register: writing_app_restore_started_at
      changed_when: false

    - name: DB 복구 작업 공유 락 획득
      ansible.builtin.command:
        argv:
          - mkdir
          - -m
          - "0700"
          - "{{ writing_app_operation_lock_directory }}"
      register: writing_app_restore_operation_lock
      changed_when: writing_app_restore_operation_lock.rc == 0
      failed_when: false

    - name: DB 복구 작업 공유 락 획득 결과 검증
      ansible.builtin.assert:
        that:
          - writing_app_restore_operation_lock.rc == 0
        fail_msg: >-
          다른 Writing App deploy, rollback, maintenance 또는 복구 작업이 이미 실행 중이거나
          operation lock을 생성할 수 없습니다. stale lock은 자동 삭제하지 않습니다.

    - name: 공유 락 아래 SQLite 복구 실행
      block:
        - name: DB 복구 fail-closed 상태 초기화
          ansible.builtin.set_fact:
            writing_app_restore_database_isolation_started: false
            writing_app_restore_recovery_status: not-required
            writing_app_restore_release_operation_lock: true
            writing_app_restore_root: >-
              {{ writing_app_backup_directory }}/{{ writing_app_restore_id }}
            writing_app_restore_candidate_directory: >-
              {{ writing_app_backup_directory }}/{{ writing_app_restore_id }}/candidate

        - name: 현재 DB 확인
          ansible.builtin.stat:
            path: "{{ writing_app_data_directory }}/api.sqlite"
          register: writing_app_database_before_restore

        - name: 현재 DB snapshot 백업
          community.docker.docker_compose_v2_run:
            project_src: "{{ writing_app_compose_directory }}"
            env_files:
              - .env
            files:
              - compose.yaml
            profiles:
              - operations
            service: database-backup
            argv:
              - "--source=/var/lib/writing-app/api.sqlite"
              - "--output=/var/backups/writing-app/pre-{{ writing_app_restore_id }}.sqlite"
            cleanup: true
            no_deps: true
            interactive: false
            tty: false
          when: writing_app_database_before_restore.stat.exists

        - name: 복구 격리 디렉터리 생성
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            owner: "{{ writing_app_container_uid }}"
            group: "{{ writing_app_container_gid }}"
            mode: "0750"
          loop:
            - "{{ writing_app_restore_root }}"
            - "{{ writing_app_restore_root }}/current"
            - "{{ writing_app_restore_candidate_directory }}"

        - name: DB writer 중지 전 operation lock 보존 설정
          ansible.builtin.set_fact:
            writing_app_restore_database_isolation_started: true
            writing_app_restore_recovery_status: pending
            writing_app_restore_release_operation_lock: false

        - name: DB writer와 Litestream 중지
          community.docker.docker_compose_v2:
            project_src: "{{ writing_app_compose_directory }}"
            env_files:
              - .env
            files:
              - compose.yaml
            services:
              - api
              - litestream
            dependencies: false
            state: stopped

        - name: SQLite 파일과 sidecar 확인
          ansible.builtin.stat:
            path: "{{ writing_app_data_directory }}/{{ item }}"
          loop:
            - api.sqlite
            - api.sqlite-wal
            - api.sqlite-shm
          register: writing_app_database_files

        - name: 현재 SQLite 파일 격리
          ansible.builtin.command:
            argv:
              - mv
              - "{{ item.stat.path }}"
              - "{{ writing_app_restore_root }}/current/{{ item.item }}"
          loop: "{{ writing_app_database_files.results }}"
          when: item.stat.exists
          changed_when: true

        - name: 지정 snapshot을 candidate 경로로 복구
          community.docker.docker_compose_v2_run:
            project_src: "{{ writing_app_compose_directory }}"
            env_files:
              - .env
            files:
              - compose.yaml
            profiles:
              - operations
            service: database-restore
            argv:
              - restore
              - -config
              - /etc/litestream.yaml
              - -timestamp
              - "{{ writing_app_restore_snapshot_at }}"
              - -integrity-check
              - full
              - -o
              - >-
                /var/backups/writing-app/{{ writing_app_restore_id }}/candidate/api.sqlite
              - /var/lib/writing-app/api.sqlite
            cleanup: true
            no_deps: true
            interactive: false
            tty: false
          no_log: true

        - name: 복구 candidate DB 존재 확인
          ansible.builtin.stat:
            path: "{{ writing_app_restore_candidate_directory }}/api.sqlite"
          register: writing_app_restored_database

        - name: 복구 candidate 확인
          ansible.builtin.assert:
            that:
              - writing_app_restored_database.stat.exists
              - writing_app_restored_database.stat.isreg
            fail_msg: 지정한 replica snapshot에서 candidate SQLite DB를 복구하지 못했습니다.

        - name: 복구 candidate 소유권 정규화
          ansible.builtin.file:
            path: "{{ writing_app_restore_candidate_directory }}"
            state: directory
            owner: "{{ writing_app_container_uid }}"
            group: "{{ writing_app_container_gid }}"
            mode: "0750"
            recurse: true

        - name: migration 전 candidate integrity와 FK 검증
          ansible.builtin.command:
            argv:
              - docker
              - run
              - --rm
              - --network
              - none
              - --user
              - "{{ writing_app_container_uid }}:{{ writing_app_container_gid }}"
              - --env
              - DATABASE_URL={{ writing_app_restore_container_database_url }}
              - --mount
              - >-
                type=bind,source={{ writing_app_restore_candidate_directory }},target=/var/lib/writing-app,readonly
              - "{{ writing_app_api_image }}"
              - bun
              - /workspace/bin/database-integrity-check
          changed_when: false

        - name: candidate DB migration 적용
          ansible.builtin.command:
            argv:
              - docker
              - run
              - --rm
              - --network
              - none
              - --user
              - "{{ writing_app_container_uid }}:{{ writing_app_container_gid }}"
              - --env
              - DATABASE_URL={{ writing_app_restore_container_database_url }}
              - --env
              - NODE_ENV=production
              - --mount
              - >-
                type=bind,source={{ writing_app_restore_candidate_directory }},target=/var/lib/writing-app
              - "{{ writing_app_api_image }}"
              - bun
              - /workspace/bin/database-migrate
          changed_when: true

        - name: migration 후 candidate application DB 검증
          ansible.builtin.command:
            argv:
              - docker
              - run
              - --rm
              - --network
              - none
              - --user
              - "{{ writing_app_container_uid }}:{{ writing_app_container_gid }}"
              - --env
              - DATABASE_URL={{ writing_app_restore_container_database_url }}
              - --env
              - NODE_ENV=production
              - --mount
              - >-
                type=bind,source={{ writing_app_restore_candidate_directory }},target=/var/lib/writing-app,readonly
              - "{{ writing_app_api_image }}"
              - bun
              - /workspace/bin/database-check
          changed_when: false

        - name: 삭제 marker 재적용 dry-run
          ansible.builtin.command:
            argv:
              - docker
              - compose
              - --env-file
              - "{{ writing_app_compose_directory }}/.env"
              - --file
              - "{{ writing_app_compose_directory }}/compose.yaml"
              - run
              - --rm
              - --no-deps
              - --name
              - writing-app-{{ writing_app_environment }}-restore-marker
              - --user
              - "{{ writing_app_container_uid }}:{{ writing_app_container_gid }}"
              - --env
              - DATABASE_URL={{ writing_app_restore_marker_database_url }}
              - --env
              - DELETION_RESTORE_ENVIRONMENT={{ writing_app_environment }}
              - --env
              - DELETION_RESTORE_EXPECTED_DATABASE_URL={{ writing_app_restore_marker_database_url }}
              - deletion-marker-restore
              - bun
              - /workspace/bin/deletion-marker-restore
              - "--snapshot-at={{ writing_app_restore_snapshot_at }}"
              - "--batch-size={{ writing_app_restore_batch_size_value }}"
              - --dry-run
          register: writing_app_restore_marker_dry_run_command
          changed_when: false
          no_log: true

        - name: 삭제 marker dry-run 결과 해석
          ansible.builtin.set_fact:
            writing_app_restore_marker_dry_run: >-
              {{ writing_app_restore_marker_dry_run_command.stdout | trim | from_json }}
          no_log: true

        - name: 삭제 marker 승인 actual 재적용
          ansible.builtin.command:
            argv:
              - docker
              - compose
              - --env-file
              - "{{ writing_app_compose_directory }}/.env"
              - --file
              - "{{ writing_app_compose_directory }}/compose.yaml"
              - run
              - --rm
              - --no-deps
              - --name
              - writing-app-{{ writing_app_environment }}-restore-marker
              - --user
              - "{{ writing_app_container_uid }}:{{ writing_app_container_gid }}"
              - --env
              - DATABASE_URL={{ writing_app_restore_marker_database_url }}
              - --env
              - DELETION_RESTORE_ENVIRONMENT={{ writing_app_environment }}
              - --env
              - DELETION_RESTORE_EXPECTED_DATABASE_URL={{ writing_app_restore_marker_database_url }}
              - --env
              - DELETION_RESTORE_APPROVED=true
              - deletion-marker-restore
              - bun
              - /workspace/bin/deletion-marker-restore
              - "--snapshot-at={{ writing_app_restore_snapshot_at }}"
              - "--batch-size={{ writing_app_restore_batch_size_value }}"
          register: writing_app_restore_marker_actual_command
          changed_when: true
          no_log: true

        - name: 삭제 marker actual 결과 해석
          ansible.builtin.set_fact:
            writing_app_restore_marker_actual: >-
              {{ writing_app_restore_marker_actual_command.stdout | trim | from_json }}
          no_log: true

        - name: 삭제 marker 수렴 재실행
          ansible.builtin.command:
            argv:
              - docker
              - compose
              - --env-file
              - "{{ writing_app_compose_directory }}/.env"
              - --file
              - "{{ writing_app_compose_directory }}/compose.yaml"
              - run
              - --rm
              - --no-deps
              - --name
              - writing-app-{{ writing_app_environment }}-restore-marker
              - --user
              - "{{ writing_app_container_uid }}:{{ writing_app_container_gid }}"
              - --env
              - DATABASE_URL={{ writing_app_restore_marker_database_url }}
              - --env
              - DELETION_RESTORE_ENVIRONMENT={{ writing_app_environment }}
              - --env
              - DELETION_RESTORE_EXPECTED_DATABASE_URL={{ writing_app_restore_marker_database_url }}
              - --env
              - DELETION_RESTORE_APPROVED=true
              - deletion-marker-restore
              - bun
              - /workspace/bin/deletion-marker-restore
              - "--snapshot-at={{ writing_app_restore_snapshot_at }}"
              - "--batch-size={{ writing_app_restore_batch_size_value }}"
          register: writing_app_restore_marker_verification_command
          changed_when: false
          no_log: true

        - name: 삭제 marker 수렴 결과 해석
          ansible.builtin.set_fact:
            writing_app_restore_marker_verification: >-
              {{ writing_app_restore_marker_verification_command.stdout | trim | from_json }}
          no_log: true

        - name: 삭제 marker 재적용 수렴 검증
          ansible.builtin.assert:
            that:
              - writing_app_restore_marker_dry_run.kind == 'deletion-marker-reapplication-result'
              - writing_app_restore_marker_dry_run.dryRun | bool
              - writing_app_restore_marker_actual.kind == 'deletion-marker-reapplication-result'
              - not (writing_app_restore_marker_actual.dryRun | bool)
              - writing_app_restore_marker_verification.kind == 'deletion-marker-reapplication-result'
              - writing_app_restore_marker_verification.markedDeletedUsers | int == 0
              - writing_app_restore_marker_verification.purgedUsers | int == 0
            fail_msg: 삭제 marker 재적용 재실행이 수렴하지 않았습니다.
          no_log: true

        - name: marker 재적용 후 candidate application DB 재검증
          ansible.builtin.command:
            argv:
              - docker
              - run
              - --rm
              - --network
              - none
              - --user
              - "{{ writing_app_container_uid }}:{{ writing_app_container_gid }}"
              - --env
              - DATABASE_URL={{ writing_app_restore_container_database_url }}
              - --env
              - NODE_ENV=production
              - --mount
              - >-
                type=bind,source={{ writing_app_restore_candidate_directory }},target=/var/lib/writing-app,readonly
              - "{{ writing_app_api_image }}"
              - bun
              - /workspace/bin/database-check
          changed_when: false

        - name: 검증된 candidate를 독립 SQLite snapshot으로 정규화
          ansible.builtin.command:
            argv:
              - docker
              - run
              - --rm
              - --network
              - none
              - --user
              - "{{ writing_app_container_uid }}:{{ writing_app_container_gid }}"
              - --mount
              - >-
                type=bind,source={{ writing_app_restore_candidate_directory }},target=/var/lib/writing-app
              - "{{ writing_app_api_image }}"
              - bun
              - /workspace/bin/database-backup
              - --source=/var/lib/writing-app/api.sqlite
              - --output=/var/lib/writing-app/verified.sqlite
          changed_when: true

        - name: 정규화한 복구 DB 최종 검증
          ansible.builtin.command:
            argv:
              - docker
              - run
              - --rm
              - --network
              - none
              - --user
              - "{{ writing_app_container_uid }}:{{ writing_app_container_gid }}"
              - --env
              - DATABASE_URL=file:/var/lib/writing-app/verified.sqlite
              - --env
              - NODE_ENV=production
              - --mount
              - >-
                type=bind,source={{ writing_app_restore_candidate_directory }},target=/var/lib/writing-app,readonly
              - "{{ writing_app_api_image }}"
              - bun
              - /workspace/bin/database-check
          changed_when: false

        - name: 검증된 복구 DB를 실제 경로에 설치
          ansible.builtin.copy:
            src: "{{ writing_app_restore_candidate_directory }}/verified.sqlite"
            dest: "{{ writing_app_data_directory }}/api.sqlite"
            remote_src: true
            owner: "{{ writing_app_container_uid }}"
            group: "{{ writing_app_container_gid }}"
            mode: "0640"

        - name: 복구된 서비스 기동
          community.docker.docker_compose_v2:
            project_src: "{{ writing_app_compose_directory }}"
            env_files:
              - .env
            files:
              - compose.yaml
            pull: never
            state: present
            wait: true
            wait_timeout: 120

        - name: DB 복구 완료 시각 기록
          ansible.builtin.command:
            argv:
              - date
              - -u
              - +%s|%Y-%m-%dT%H:%M:%SZ
          register: writing_app_restore_completed_at
          changed_when: false

        - name: DB 복구 결과와 소요 시간 기록
          ansible.builtin.copy:
            dest: "{{ writing_app_restore_root }}/result.json"
            owner: root
            group: root
            mode: "0640"
            content: >-
              {{
                {
                  'apiImage': writing_app_api_image,
                  'completedAt': writing_app_restore_completed_at.stdout.split('|')[1],
                  'durationSeconds': (
                    writing_app_restore_completed_at.stdout.split('|')[0] | int
                  ) - (
                    writing_app_restore_started_at.stdout.split('|')[0] | int
                  ),
                  'environment': writing_app_environment,
                  'kind': 'database-restore-drill-result',
                  'litestreamImage': writing_app_litestream_image,
                  'markerActual': writing_app_restore_marker_actual,
                  'markerDryRun': writing_app_restore_marker_dry_run,
                  'markerVerification': writing_app_restore_marker_verification,
                  'restoreId': writing_app_restore_id,
                  'snapshotAt': writing_app_restore_snapshot_at,
                  'startedAt': writing_app_restore_started_at.stdout.split('|')[1],
                  'status': 'verified-success'
                }
                | to_nice_json
              }}
          no_log: true

        - name: 검증된 DB 복구 후 operation lock 해제 허용
          ansible.builtin.set_fact:
            writing_app_restore_recovery_status: verified-success
            writing_app_restore_release_operation_lock: true
      rescue:
        - name: DB 복구 fail-closed 실패 stage 계산
          ansible.builtin.set_fact:
            writing_app_restore_failure_stage: >-
              {{ ansible_failed_task.name | default('unknown') }}

        - name: DB 복구 fail-closed recovery 증적 기록
          ansible.builtin.copy:
            dest: "{{ writing_app_restore_root }}/recovery.txt"
            owner: root
            group: root
            mode: "0640"
            content: |
              operation=database-restore
              status=failed
              failure_state=fail-closed
              failed_at={{ ansible_date_time.iso8601 }}
              failure_stage={{ writing_app_restore_failure_stage }}
              database_isolation_started={{ writing_app_restore_database_isolation_started | default(false) | bool }}
              recovery_status={{ writing_app_restore_recovery_status | default('unknown') }}
              operation_lock_retained={{ not (writing_app_restore_release_operation_lock | default(false) | bool) }}
              next_action=operation lock을 유지하고 current/candidate DB, replica restore 결과와 Compose runtime을 읽기 전용으로 점검한 뒤 incident 책임자가 수동 복구를 결정합니다.
          failed_when: false
          when: >-
            writing_app_restore_database_isolation_started
            | default(false) | bool

        - name: DB 복구 fail-closed 실패 종료
          ansible.builtin.fail:
            msg: >-
              SQLite 복구가 {{ writing_app_restore_failure_stage }} 단계에서 실패했습니다.
              SQLite 격리가 시작된 뒤의 실패이면 operation lock과 복구 증적을 보존했습니다.
      always:
        - name: 이 DB 복구 실행이 획득한 공유 락 해제
          ansible.builtin.file:
            path: "{{ writing_app_operation_lock_directory }}"
            state: absent
          when:
            - writing_app_restore_operation_lock.rc == 0
            - writing_app_restore_release_operation_lock | default(false) | bool
