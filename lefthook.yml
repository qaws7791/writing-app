# lefthook.yml

pre-commit:
  parallel: true
  commands:
    format:
      glob: "**/*.{ts,tsx,js,jsx,cjs,mjs,json,md,mdx,yaml,yml,css}"
      run: bun oxfmt --ignore-path .gitignore {staged_files}
      stage_fixed: true

    lint:
      glob: "{apps,packages,scripts}/**/*.{ts,tsx,js,jsx,cjs,mjs}"
      run: bun oxlint --deny-warnings {staged_files}
