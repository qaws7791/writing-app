# lefthook.yml

pre-commit:
  parallel: true
  commands:
    # format all files with oxfmt (excluding packages/ui CSS which uses @apply)
    format:
      glob: "**/*.{ts,tsx,js,jsx,cjs,mjs,json,md,yaml,yml}"
      exclude: "packages/ui/**/*.css"
      run: bunx oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    # oxlint for all staged files
    oxlint:
      glob: "**/*.{ts,tsx,js,jsx}"
      run: bunx oxlint --fix {staged_files}
      stage_fixed: true

    workspace-lint:
      glob: "{apps,packages}/**/*.{ts,tsx,js,jsx}"
      run: bun run scripts/lint-staged-workspaces.ts {staged_files}

pre-push:
  commands:
    turbo-lint:
      run: bun turbo run lint
