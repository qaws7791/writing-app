# lefthook.yml

pre-commit:
  parallel: true
  commands:
    # format all staged files with the root Oxfmt config
    format:
      glob: "**/*.{ts,tsx,js,jsx,cjs,mjs,json,md,mdx,yaml,yml,css}"
      run: bun oxfmt --ignore-path .gitignore {staged_files}
      stage_fixed: true

    workspace-lint:
      glob: "{apps,packages}/**/*.{ts,tsx,js,jsx}"
      run: bun run scripts/lint-staged-workspaces.ts {staged_files}

    workspace-inventory:
      glob: "{package.json,turbo.json,vitest.workspace.ts,docs/engineering/workspace-inventory.md,docs/engineering/testing.md,ARCHITECTURE.md,CONTEXT.md,docs/engineering/system-overview.md,scripts/check-workspace-inventory.ts}"
      run: bun run check:workspace-inventory

    document-drift:
      glob: "{README.md,CONTEXT.md,ARCHITECTURE.md,BACKEND.md,FRONTEND.md,DOMAIN.md,GLOSSARY.md,docs/**/*.md,apps/api/src/**/*.ts,apps/admin-api/src/**/*.ts,package.json,apps/*/package.json,packages/*/package.json,scripts/check-document-drift.ts}"
      run: bun run check:document-drift

pre-push:
  commands:
    workspace-lint:
      run: bun run lint
